plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://cursemaven.com' }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Exact audited dependency used by the typed ColorTooltips diagnostic mixins.
    // CurseForge project 1501616, file 8412139 = colortooltips-1211.3.4.jar.
    implementation 'curse.maven:colortooltips-1501616:8412139'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    archiveFileName = "CT-BN-Compat-1.21.1-v${mod_version}.jar"
}
