plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://cursemaven.com' }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Use the exact archived real dependencies; these are not bundled in the mod JAR.
    implementation files('reference-dependencies/colortooltips-1211.3.4.jar')
    compileOnly files('reference-dependencies/jei-1.21.1-neoforge-19.44.0.403.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    archiveFileName = "CT-BN-Compat-1.21.1-v${mod_version}.jar"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.register('diagnosticTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.devun.ctbncompat.TraceTests'
}
tasks.named('check') { dependsOn tasks.named('diagnosticTest') }
